[project]
name = "tasks-worker-service"
version = "0.2.1"
description = "Tasks Worker Service for Job Platform"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.18.4",
    "aiosqlite==0.22.0",
    "asyncpg==0.31.0",
    "fastapi==0.136.3",
    "sqlalchemy[asyncio]==2.0.50",
    "uvicorn[standard]==0.49.0",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "numpy>=2.3.0",
    "onnxruntime>=1.23.0",
    "pyyaml>=6.0.2",
    "redis==6.4.0",
    "soundfile>=0.13.0",
    "taskiq==0.12.4",
    "taskiq-redis==1.1.2",
    "tritonclient[http]>=2.60.0",
]

[project.optional-dependencies]
# Optional runtime capability groups. Keep them empty in the skeleton until a
# real service enables and verifies the adapter dependencies.
redis = []
storage-s3 = []
worker-taskiq = []
worker-celery = []
metrics = []

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres_integration: tests that require a migrated local PostgreSQL test database",
    "redis_stream_integration: tests that require a local Redis Stream broker",
    "audio_cpu_integration: tests that require local audio stem models and sample data",
]
